[project]
name = "finreader"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=6.0.2",
]
[project.optional-dependencies]
test = [
    'pytest'
]
[tool.ruff]
[tool.ruff.lint]
extend-select = [
    'D'
]
ignore = [
    'D203',
    'D212'
]
[tool.ruff.format]
quote-style = 'single'

[tool.setuptools.package-data]
'finreader' = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ipdb>=0.13.13",
    "ruff>=0.15.4",
    "basedpyright",
    "jupyterlab>=4.5.6",
]
